name: Release Validation

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate-release:

    name: Validate Release

    runs-on: ubuntu-latest

    steps:

      #########################################
      # Checkout Repository
      #########################################

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      #########################################
      # Validate Git Tag
      #########################################

      - name: Validate Git Tag
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [ -z "$TAG" ]; then
            echo "No release tag found."
            exit 1
          fi

          git fetch --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Validated tag: $TAG"
          else
            echo "Tag does not exist."
            exit 1
          fi

      #########################################
      # Verify Version Consistency
      #########################################

      - name: Verify Version
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)

            if [ "$VERSION" != "$TAG" ]; then
              echo "VERSION file ($VERSION) does not match release tag ($TAG)."
              exit 1
            fi
          else
            echo "VERSION file not found. Skipping version consistency check."
          fi

      #########################################
      # Verify Release Assets
      #########################################

      - name: Verify Release Assets
        run: |
          echo "Release Name : ${{ github.event.release.name }}"
          echo "Release Tag  : ${{ github.event.release.tag_name }}"
          echo "Assets Count : ${{ github.event.release.assets_count }}"
          echo "Draft        : ${{ github.event.release.draft }}"
          echo "Prerelease   : ${{ github.event.release.prerelease }}"

      #########################################
      # Generate Validation Report
      #########################################

      - name: Generate Report
        run: |
          cat <<EOF > release-validation-report.md
          # Release Validation Report

          ## Repository

          - Repository: ${{ github.repository }}
          - Release: ${{ github.event.release.name }}
          - Tag: ${{ github.event.release.tag_name }}

          ## Validation

          - Git tag verified
          - Repository checked out successfully
          - Version consistency checked
          - Release metadata validated

          ## Generated

          $(date -u)
          EOF

      #########################################
      # Upload Validation Report
      #########################################

      - name: Upload Validation Report
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-report
          path: release-validation-report.md

      #########################################
      # GitHub Step Summary
      #########################################

      - name: Publish Summary
        run: |
          {
            echo "# Release Validation Summary"
            echo ""
            echo "## Validation Status"
            echo ""
            echo "- ✅ Git tag validated"
            echo "- ✅ Release metadata verified"
            echo "- ✅ Version consistency checked"
            echo "- ✅ Validation report generated"
            echo ""
            echo "Release validation completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      #########################################
      # Completion
      #########################################

      - name: Validation Complete
        run: |
          echo "Release validation completed successfully."