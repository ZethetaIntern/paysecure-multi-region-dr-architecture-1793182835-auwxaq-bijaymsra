name: Automatic Merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  automerge:

    name: Auto Merge Dependabot PRs

    if: >
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:

      #########################################
      # Checkout Repository
      #########################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################
      # Verify Labels
      #########################################

      - name: Verify Auto Merge Label
        id: label-check
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const allowed = labels.includes("dependencies") || labels.includes("automerge");

            if (!allowed) {
              core.setFailed("Required label (dependencies/automerge) not found.");
            }

      #########################################
      # Enable Auto Merge
      #########################################

      - name: Enable Auto Merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

      #########################################
      # Summary
      #########################################

      - name: Auto Merge Summary
        run: |
          echo "Dependabot PR passed validation."
          echo "Auto merge has been enabled."
          echo "Merge will occur after all required status checks succeed."