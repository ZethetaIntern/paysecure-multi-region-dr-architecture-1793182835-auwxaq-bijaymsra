name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name
        required: true
        type: string

      image_tag:
        description: Docker image tag
        required: false
        default: latest
        type: string

      context:
        description: Docker build context
        required: false
        default: .
        type: string

      dockerfile:
        description: Dockerfile location
        required: false
        default: Dockerfile
        type: string

      push:
        description: Push image to registry
        required: false
        default: true
        type: boolean

    secrets:
      GHCR_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:

  docker:

    name: Build and Publish Docker Image

    runs-on: ubuntu-latest

    steps:

      #########################################
      # Checkout
      #########################################

      - name: Checkout Repository
        uses: actions/checkout@v7

      #########################################
      # Setup Buildx
      #########################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      #########################################
      # Login to GitHub Container Registry
      #########################################

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      #########################################
      # Docker Metadata
      #########################################

      - name: Extract Image Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image_name }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      #########################################
      # Build & Push
      #########################################

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #########################################
      # Summary
      #########################################

      - name: Docker Build Summary
        run: |
          echo "Docker image build completed successfully."
          echo "Image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}"
          echo "Tag: ${{ inputs.image_tag }}"
          echo "Platforms: linux/amd64, linux/arm64"
          echo "Push Enabled: ${{ inputs.push }}"