name: OpenSSF Scorecards

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 4 * * 1"

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:

  scorecards:

    name: OpenSSF Scorecards Analysis

    runs-on: ubuntu-latest

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:

      #########################################
      # Checkout
      #########################################

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      #########################################
      # Run Scorecards
      #########################################

      - name: Run OpenSSF Scorecards
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      #########################################
      # Upload SARIF
      #########################################

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif

      #########################################
      # Upload Artifact
      #########################################

      - name: Upload Scorecards Artifact
        uses: actions/upload-artifact@v7
        with:
          name: openssf-scorecards
          path: scorecard-results.sarif
          if-no-files-found: error

      #########################################
      # Summary
      #########################################

      - name: Scorecards Summary
        run: |
          echo "OpenSSF Scorecards analysis completed successfully."
          echo "SARIF results have been uploaded to GitHub Security."