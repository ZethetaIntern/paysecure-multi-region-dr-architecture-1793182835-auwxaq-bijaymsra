name: Repository Cleanup

on:
  schedule:
    - cron: "0 3 * * 0"

  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:

  cleanup:

    name: Repository Maintenance

    runs-on: ubuntu-latest

    steps:

      #########################################
      # Delete Old Workflow Artifacts
      #########################################

      - name: Delete Workflow Artifacts
        uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          expire-in: 30 days

      #########################################
      # Cleanup GitHub Actions Cache
      #########################################

      - name: Cleanup GitHub Actions Cache
        uses: easimon/delete-cache@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      #########################################
      # Repository Statistics
      #########################################

      - name: Repository Statistics
        run: |
          echo "Repository Maintenance"
          echo "======================"
          echo "Repository : ${{ github.repository }}"
          echo "Workflow   : ${{ github.workflow }}"
          echo "Run ID     : ${{ github.run_id }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Date       : $(date -u)"

      #########################################
      # Maintenance Summary
      #########################################

      - name: Maintenance Summary
        run: |
          {
            echo "## Repository Cleanup Summary"
            echo ""
            echo "- Old workflow artifacts removed (retention > 30 days)"
            echo "- GitHub Actions cache cleanup executed"
            echo "- Repository maintenance completed successfully"
            echo "- Weekly retention policy enforced"
          } >> "$GITHUB_STEP_SUMMARY"

      #########################################
      # Completion
      #########################################

      - name: Cleanup Complete
        run: |
          echo "Repository cleanup completed successfully."